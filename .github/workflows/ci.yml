name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Run minimal CLI smoke checks
        run: |
          python -m operance.cli --print-config > /dev/null
          python -m operance.cli --supported-commands > /dev/null

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy

  spec-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check spec and documentation sync
        run: python3 scripts/check_spec_sync.py --base "${{ github.event.pull_request.base.sha }}"

  fedora-package-smoke:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y -q python3 python3-pip rpm-build rpmdevtools

      - name: Build the RPM
        run: bash scripts/build_rpm_package.sh

      - name: Install the RPM and check the packaged command
        run: |
          rpm_path="$(find dist/rpm -name 'operance-*.noarch.rpm' | head -1)"
          test -n "${rpm_path}"
          dnf install -y -q "./${rpm_path}"
          operance --version
          operance --doctor > /dev/null
          test -f /usr/lib/systemd/user/operance-tray.service
          test -f /usr/lib/systemd/user/operance-voice-loop.service

  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run packaging and release dry-run smoke checks
        run: |
          bash scripts/render_packaged_assets.sh --dry-run > /dev/null
          bash scripts/build_package_artifacts.sh --rpm --dry-run > /dev/null
          bash scripts/build_release_artifacts.sh --dry-run > /dev/null
          bash scripts/run_installed_package_smoke.sh --dry-run > /dev/null
          bash scripts/run_fedora_release_smoke.sh --dry-run > /dev/null
          bash scripts/run_fedora_gate.sh --dry-run > /dev/null
